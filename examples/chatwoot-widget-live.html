<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能客服 - Chatwoot Widget 在线演示</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 700px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            text-align: center;
        }
        h1 { font-size: 2.2rem; color: #2d3748; margin: 0 0 16px; }
        p { color: #4a5568; font-size: 1.1rem; line-height: 1.7; }
        .steps {
            text-align: left;
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px 28px;
            margin: 24px 0;
        }
        .steps li { margin: 8px 0; color: #4a5568; }
        .badge {
            display: inline-block;
            background: #48bb78;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 AI 智能客服</h1>
        <p>点击右下角聊天按钮开始对话。<br>消息将进入 Chatwoot 客服工作台（http://localhost:3000）</p>
        <div class="steps">
            <h3 style="margin-top:0">这个页面演示：</h3>
            <ol>
                <li>访客在网页上发起对话</li>
                <li>会话进入 Chatwoot（客服工作台可查看）</li>
                <li>Bridge Service 接收 webhook 并让 AI 自动回复</li>
            </ol>
        </div>
        <span class="badge">✅ Chatwoot Inbox 已连接</span>
    </div>

    <!-- Chatwoot Widget -->
    <script>
        (function(d,t) {
            var BASE_URL="http://localhost:3000";
            var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
            g.src=BASE_URL+"/packs/js/sdk.js";
            g.defer = true;
            g.async = true;
            s.parentNode.insertBefore(g,s);
            g.onload=function(){
                window.chatwootSDK.run({
                    websiteToken: 'YOUR_CHATWOOT_WEBSITE_TOKEN',
                    baseUrl: BASE_URL
                })
            }
        })(document,"script");
    </script>
</body>
</html>
