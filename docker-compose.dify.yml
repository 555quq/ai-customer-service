services:
  # Optional enhanced-edition adapter. Dify itself remains an independently
  # versioned, per-customer stack; see docs/operations/a5-dify-profile.md.
  bridge:
    environment:
      AI_PROVIDER: dify
      DIFY_API_URL: ${DIFY_API_URL:?Set DIFY_API_URL to this customer's Dify API endpoint}
      DIFY_API_KEY: ${DIFY_API_KEY:?Set DIFY_API_KEY to this customer's Dify app key}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dify-readiness:
        condition: service_completed_successfully

  dify-readiness:
    profiles: ["dify"]
    build:
      context: ./bridge-service
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${BRIDGE_PIP_INDEX_URL:-https://pypi.org/simple}
    image: ai-customer-service-bridge:${APP_VERSION:-1.0.0}
    container_name: ai-customer-service-dify-readiness
    environment:
      DIFY_API_URL: ${DIFY_API_URL:?Set DIFY_API_URL to this customer's Dify API endpoint}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, sys, urllib.request
        url = os.environ['DIFY_API_URL'].rstrip('/').removesuffix('/v1') + '/health'
        try:
            response = urllib.request.urlopen(url, timeout=10)
            print(f'Dify readiness: {response.status} {url}')
            sys.exit(0 if response.status < 500 else 1)
        except Exception as exc:
            print(f'Dify readiness failed: {exc}', file=sys.stderr)
            sys.exit(1)
    networks:
      - internal
    restart: "no"
