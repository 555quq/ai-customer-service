name: Bug 报告
description: 报告可复现的缺陷
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "请先删除日志中的密钥、Cookie、客户信息和会话内容。"
  - type: input
    id: version
    attributes:
      label: 版本
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署模式
      options: [标准版, Dify 增强版, 生产 HTTPS overlay, 开发环境]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
